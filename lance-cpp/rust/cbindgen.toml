# cbindgen configuration for generating C headers

language = "C"
header = "/* SPDX-License-Identifier: Apache-2.0 */"
include_guard = "LANCE_CPP_FFI_H"
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Do not modify. */"
pragma_once = true
cpp_compat = true

[export]
prefix = "lance_"
item_types = ["globals", "enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]

[export.rename]
"ErrorCode" = "LanceErrorCode"
"Dataset" = "LanceDataset"
"Scanner" = "LanceScanner"
"FragmentMetadata" = "LanceFragmentMetadata"

[parse]
parse_deps = false
include = ["lance-cpp-ffi"]

[layout]
aligned_n = "alignof"

[fn]
rename_args = "GeckoCase"
must_use = "MUST_USE_FUNC"

[struct]
rename_fields = "ScreamingSnakeCase"

[enum]
rename_variants = "ScreamingSnakeCase"

